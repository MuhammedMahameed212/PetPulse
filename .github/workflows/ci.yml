name: PetPulse CI/CD & Metrics Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend (Django Tests & Coverage Metrics)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python dependencies & coverage tool
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt coverage

      - name: Django system check
        run: python backend/manage.py check

      - name: Check for missing database migrations
        run: python backend/manage.py makemigrations --check --dry-run

      - name: Apply database migrations
        run: python backend/manage.py migrate

      - name: Run Django tests with Coverage Metrics
        run: |
          coverage run --rcfile=.coveragerc backend/manage.py test petpulse_core --verbosity=2
          coverage report --rcfile=.coveragerc -m
          coverage xml --rcfile=.coveragerc -o coverage.xml

      - name: Publish Backend Coverage Metrics to GitHub Job Summary
        if: always()
        run: |
          echo "## 🐍 Backend Test & Coverage Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          coverage report --rcfile=.coveragerc --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Upload Coverage XML Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage.xml

  frontend-ci:
    name: Frontend (React Vite Build & Bundle Metrics)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build production React bundle
        run: npm run build

      - name: Publish Frontend Build Metrics to GitHub Job Summary
        run: |
          echo "## ⚛️ Frontend Production Bundle Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size (Bytes) |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | ---: |" >> $GITHUB_STEP_SUMMARY
          for f in dist/assets/*; do
            if [ -f "$f" ]; then
              size=$(wc -c < "$f" | tr -d ' ')
              echo "| \`$(basename "$f")\` | ${size} B |" >> $GITHUB_STEP_SUMMARY
            fi
          done

