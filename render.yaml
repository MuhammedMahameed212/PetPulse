databases:
  - name: petpulse-db
    plan: free
    databaseName: petpulse
    user: petpulse_user

services:
  - type: web
    name: petpulse-web
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn --chdir backend petpulse_core.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.13"
      - key: NODE_VERSION
        value: "20.18.0"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: petpulse-db
          property: connectionString

